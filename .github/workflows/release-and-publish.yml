name: Build, Release & Publish

on:
  push:
    branches:
      - master
  # A manual run publishes whatever haxelib.json says — the way to retry a
  # version whose push-triggered publish failed.
  workflow_dispatch:

jobs:
  build:
    name: Checkout & Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

      #
      # ADD TEST/BUILD STEPS HERE
      #

  release:
    name: Check version & Create release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      released: ${{ steps.check.outputs.version || steps.manual.outputs.version }} # expose release.outputs.released for the "publish" job
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - uses: EndBug/version-check@v1
      if: github.event_name == 'push'
      id: check
      with:
        file-name: haxelib.json
        diff-search: true
    - name: Create Release
      if: steps.check.outputs.changed
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.check.outputs.version }}
        # tag_name: ${{ github.ref }}
        release_name: ${{ steps.check.outputs.version }}
        # release_name: ${{ github.ref }}
        draft: false
        prerelease: false
    - name: Read version (manual run)
      if: github.event_name == 'workflow_dispatch'
      id: manual
      run: echo "version=$(jq -r .version haxelib.json)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Haxelib
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released
    steps:
      - uses: actions/checkout@v2
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.2
      # haxelib.json lists two contributors, so submit reads which one is
      # submitting before the password: without it the password becomes the user
      - run: |
          if [ -z "$HAXELIB_PASSWORD" ]; then
            echo "::error::HAXELIB_PASSWORD isn't set for this repository" >&2
            exit 1
          fi
          zip colyseus-websocket.zip $(find src -name '*.hx') haxelib.json LICENSE README.md
          haxe -version
          haxelib submit colyseus-websocket.zip endel "$HAXELIB_PASSWORD"
        env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
